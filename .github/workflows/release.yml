name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
      - run: npm i -g npm@latest

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Setup
        run: npm i -g pnpm@9

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Publish to NPM
        run: |
          pnpm run build
          TARBALL=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          VERSION=$(node -p "require('./package.json').version")

          # A prerelease must name its dist-tag explicitly; without one npm 11
          # refuses to publish. Using `beta` also keeps `latest` on the stable
          # line so a plain install does not pick up a beta.
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
            echo "publishing $VERSION under dist-tag $DIST_TAG"
            npm publish "$TARBALL" --access public --tag "$DIST_TAG"
          else
            echo "publishing $VERSION as latest"
            npm publish "$TARBALL" --access public
          fi
